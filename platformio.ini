[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = time, esp32_exception_decoder
lib_deps =
  marian-craciunescu/ESP32Ping@1.7.0
build_flags =
  -DCORE_DEBUG_LEVEL=0

[env:esp32dev_qa]
extends = env:esp32dev
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DQA_FAST=1

; For boards whose USB-UART auto-reset fails: hold BOOT, tap EN, then upload
; with this environment. esptool will not toggle DTR before connecting.
[env:esp32dev_boot]
extends = env:esp32dev
upload_speed = 115200
upload_flags =
  --before
  no_reset
