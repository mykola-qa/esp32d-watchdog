name: Firmware build

on:
  push:
  pull_request:

jobs:
  platformio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio
          python -m pip install -r tests/requirements.txt

      - name: Create CI configuration
        run: cp include/secrets.h.example include/secrets.h

      - name: Build production firmware
        run: pio run -e esp32dev

      - name: Build QA firmware
        run: pio run -e esp32dev_qa

      - name: Build manual-boot firmware
        run: pio run -e esp32dev_boot

      - name: Collect tests
        run: python -m pytest --collect-only -q
